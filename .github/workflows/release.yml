name: Release

# CI release, dispatched manually (workflow_dispatch), NEVER by pushing a tag: a
# hand-pushed tag trips the pre-push guard's workflow scan, and the fleet standard
# is for the CI to create the tag itself. `build` signs the APK and packages the
# WebUI zip (signing key injected from encrypted secrets at build time and wiped
# after), then uploads them as an artifact. `publish` runs behind the
# `release-approval` environment (if the owner configured a required reviewer it
# approves the deployment - approving is not publishing) and then `gh release
# create` makes BOTH the tag and the release server-side as github-actions[bot],
# with the version read from webui/module.prop. Never draft, never the UI Publish
# button, never a PAT. The human gate to start a release is dispatching this
# workflow on the default branch.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Extra release notes (optional; prepended to the generated body)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Drop the local JBR pin (CI uses the temurin JDK from setup-java)
        run: sed -i '/^org.gradle.java.home=/d' VDGoogle/gradle.properties

      - name: Inject signing material
        env:
          KEYSTORE_B64: ${{ secrets.VDGOOGLE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VDGOOGLE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VDGOOGLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VDGOOGLE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::VDGOOGLE_KEYSTORE_B64 secret is not set - cannot sign the release."
            exit 1
          fi
          JKS="$GITHUB_WORKSPACE/VDGoogle/vd-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$JKS"
          {
            echo "storeFile=$JKS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/VDGoogle/keystore.properties"

      - name: Build release APK
        working-directory: VDGoogle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Wipe signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/VDGoogle/keystore.properties" "$GITHUB_WORKSPACE/VDGoogle/vd-release.jks"

      - name: Build WebUI module zip
        run: |
          bash tools/gen-update-json.sh
          bash VDGoogle/webui/package.sh

      - name: Collect + verify
        run: |
          mkdir -p dist
          cp VDGoogle/app/build/outputs/apk/release/*.apk dist/
          # the WebUI zip is already in dist/ (package.sh writes it there)
          ls -l dist/
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for a in dist/*.apk; do
            echo "== $a =="
            "$APKSIGNER" verify --print-certs "$a" | grep -iE 'certificate DN|Verified using v2|Verified using v3' || true
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vdgoogle-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Owner-configured gate: if a required reviewer is set, it approves the
    # deployment (not the publish), so the release stays authored by the bot.
    environment: release-approval
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: vdgoogle-release
          path: dist

      - name: Prepare release notes and version
        env:
          EXTRA_NOTES: ${{ github.event.inputs.notes }}
        run: |
          ver="$(sed -n 's/^version=//p' VDGoogle/webui/module.prop)"
          [ -n "$ver" ] || { echo "::error::could not read version from VDGoogle/webui/module.prop"; exit 1; }
          VER="${ver#v}"
          : > body.md
          [ -n "$EXTRA_NOTES" ] && printf '%s\n\n' "$EXTRA_NOTES" >> body.md
          awk -v h="## [$VER]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md >> body.md
          if [ ! -s body.md ]; then echo "See the commit history for the changes in this version." > body.md; fi
          printf '\n---\n\n📣 Join the channel for updates: @Priv8_VD https://t.me/Priv8_VD\n' >> body.md
          echo "VDG_VER=$ver" >> "$GITHUB_ENV"
          cat body.md

      - name: Publish release (bot-authored; gh release create makes the tag server-side)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VDG_VER" --target "$GITHUB_SHA" --title "VD Google $VDG_VER" --notes-file body.md dist/*

      - name: Assert release author is github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author="$(gh release view "$VDG_VER" --json author -q '.author.login')"
          if [ "$author" != "github-actions[bot]" ]; then
            echo "::error::Release $VDG_VER was authored by '$author', not github-actions[bot] - auditability rule violated. The release step must use github.token, never a user PAT."
            exit 1
          fi
          echo "Release author verified: github-actions[bot]"

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # dialect inferred per shebang (webui scripts mix /system/bin/sh and bash).
          shellcheck -S error VDGoogle/webui/*.sh
          shellcheck -S error .github/scripts/*.sh
          shellcheck -S error tools/*.sh

      - name: Validate JSON
        run: |
          for f in VDGoogle/webui/update.json VDGoogle/webui/webroot/config.json VDGoogle/webui/webroot/lang/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok $f"
          done

      - name: Kit guards (release-workflow-lint + binary provenance)
        run: |
          # Self-contained guards (check only this repo) - gate HERE. vendor-parity (vs the private
          # kit) compares against a separate canonical repo not fetched in CI, so it is enforced in
          # the local pre-push ritual (no CI secret, by design).
          sh .github/scripts/release-workflow-lint.sh .
          sh .github/scripts/provenance-check.sh .
          echo "vendor-parity: enforced in the local pre-push ritual"

      - name: i18n accent-fold guard (docs translations)
        run: |
          # Catch ASCII-folded accented-Latin translations (docs/, README.<code>.md, webroot/lang).
          # Guards the docs on every push/PR that touches them; this is NOT a release gate.
          sh .github/scripts/i18n-accents.sh .

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''          # the obsolete 'tools' default fails; we install exactly what we need below

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Drop the local JBR pin (CI uses the temurin JDK from setup-java)
        run: sed -i '/^org.gradle.java.home=/d' VDGoogle/gradle.properties

      - name: Build debug APK (sanity, unsigned)
        working-directory: VDGoogle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble WebUI module zip (sanity)
        run: |
          cd VDGoogle/webui && zip -r9 "$GITHUB_WORKSPACE/VD-Google-webui-ci.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: VD-Google-ci
          path: |
            VDGoogle/app/build/outputs/apk/debug/*.apk
            VD-Google-webui-ci.zip

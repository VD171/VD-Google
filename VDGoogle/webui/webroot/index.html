<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3f5bd9">
    <title>VD Google</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrap">
        <div class="appbar">
            <img src="icon.png" alt="VD Google">
            <div style="flex:1 1 auto; min-width:0">
                <div class="title">
                    <h1 data-i18n="app_name">VD Google</h1>
                    <span class="ver" id="ver">v1.08</span>
                </div>
                <div class="tagline" data-i18n="app_tagline">Your Google services, read on your device</div>
            </div>
            <button class="iconbtn" id="export" title="Export">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>
            </button>
            <button class="iconbtn" id="refresh" title="Reload">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
            <button class="iconbtn" id="theme" title="Theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>

        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="rcs" data-i18n="tab_rcs">RCS</button>
            <button class="tab" data-tab="wallet" data-i18n="tab_wallet">Wallet</button>
            <button class="tab" data-tab="att" data-i18n="tab_att">Attestations</button>
            <button class="tab" data-tab="about" data-i18n="tab_about">About</button>
        </div>

        <div id="view"></div>
    </div>

    <div class="overlay" id="confirm-ov">
        <div class="dialog">
            <h3 id="confirm-title"></h3>
            <p id="confirm-msg"></p>
            <div class="actions">
                <button id="confirm-no"></button>
                <button id="confirm-yes"></button>
            </div>
        </div>
    </div>

    <div class="overlay" id="info-ov">
        <div class="dialog">
            <h3 id="info-title"></h3>
            <p id="info-msg"></p>
            <div class="actions">
                <button id="info-close"></button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="lang/en.js"></script>
    <script src="i18n.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
